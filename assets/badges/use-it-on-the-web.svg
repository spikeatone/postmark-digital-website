<svg xmlns="http://www.w3.org/2000/svg" width="112" height="40" viewBox="0 0 112 40">
  <title>Use it on the Web</title>
  <!-- Drawn to sit beside Apple's "Download on the App Store" and Google's "Get it on Google Play" badges:
       black body, 1px #A6A6A6 edge, 5px corners, white mark on the left, small caps line over a large word. -->
  <rect x="0.5" y="0.5" width="111" height="39" rx="5.5" fill="#000" stroke="#A6A6A6" stroke-width="1"/>
  <g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="20" r="10"/>
    <ellipse cx="20" cy="20" rx="4.2" ry="10"/>
    <path d="M10 20h20"/>
    <path d="M11.6 14.5c5.3 1.6 11.5 1.6 16.8 0"/>
    <path d="M11.6 25.5c5.3-1.6 11.5-1.6 16.8 0"/>
  </g>
  <g fill="#fff" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="38" y="15.5" font-size="7.6" font-weight="500" letter-spacing="0.5">USE IT ON THE</text>
    <text x="37.4" y="31.4" font-size="17.5" font-weight="500" letter-spacing="-0.2">Web</text>
  </g>
</svg>
